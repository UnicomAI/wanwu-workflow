server:
  http_endpoint: :8999
  max_req_body_size: 209715200 # 1024 * 1024 * 200 = 200M

log:
  std: true
  level: debug
  logs:
    - enable: true
      filename: log/workflow-info.log
      level: info
      max_size: 10
      max_backups: 10
      max_age: 30
    - enable: true
      filename: log/workflow-err.log
      level: error
      max_size: 10
      max_backups: 10
      max_age: 30

